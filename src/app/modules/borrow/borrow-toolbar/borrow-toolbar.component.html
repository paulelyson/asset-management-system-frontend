<div class="toolbar-container">
  <div class="filter-badge-wrapper">
    @for (filter of filters(); track filter['field']) {
      <app-badge
        size="md"
        [hasCloseIcon]="filter['field'] !== 'department'"
        type="default"
        (closed)="onBadgeClosed(filter)"
      >
        {{ filter['value'] }}
      </app-badge>
    }
  </div>
  <span class="spacer"></span>
  @if (showClearFilter()) {
    <app-button appearance="link" icon="history" (btnclicked)="clearFilter()">
      Clear Filters
    </app-button>
  }
  <app-button appearance="link" icon="assignment" (btnclicked)="onToggleBorrowForm()">
    Open Borrow Form
  </app-button>
  <app-button appearance="link" icon="filter_list" (btnclicked)="openFilterDialog()">
    Filter
  </app-button>
  <app-input suffix_icon="search" [formControl]="searchControl" placeholder="Equipment Name" />
</div>
