<section id="toolbar">
  <div class="toolbar-container">
    <div class="filter-badge-wrapper">
      @for(filter of filters; track filter['field']) {
      <app-badge size="sm" [hasCloseIcon]="true" type="success">
        {{ filter['value'] }}
      </app-badge>
      }
    </div>
    <span class="spacer"></span>
    @if(filters.length) {
    <app-button variant="link" icon="history"> Clear Filters </app-button>
    }
    <app-button
      variant="link"
      [icon]="sidenav_opened ? 'arrow_forward' : 'arrow_back'"
      (btnclicked)="onToggleBorrowForm()"
    >
      Borrow Form
    </app-button>
    <app-button variant="link" icon="filter_list"> Filter </app-button>
    <app-input suffix_icon="search" [formControl]="searchControl" placeholder="Equipment Name" />
  </div>
</section>
