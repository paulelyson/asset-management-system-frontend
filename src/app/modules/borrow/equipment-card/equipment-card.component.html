<div class="card-container" [ngClass]="[size, type, shade]">
  <div class="image-wrapper">
    <img class="fit-image" [src]="image" />
  </div>
  <div class="equipment-name">{{ equipment.name }}</div>
  <div class="brand-qty">
    <span>{{ equipment.brand }}</span>
    <!-- <app-icon name="numbers"></app-icon>
    <span>{{ equipment.totalQuantity }}</span> -->
  </div>
  <div class="availability">
    <app-badge type="success" size="sm">1 Available</app-badge>
    <app-icon name="info" tooltip="Equipment Info" (iconclicked)="onViewEquipmentInfo()"/>
  </div>
  <div class="action-wrapper">
    <app-button
      variant="link"
      icon="add"
      width="width-filled"
      type="primary"
      (click)="onAddEquipment()"
      >Add
      </app-button
    >
  </div>
</div>
