<form [formGroup]="classScheduleForm" (ngSubmit)="onSubmit()">
  <div class="class-detail-container">
    <div class="subtitle">Subject and Purpose</div>
    <ely-autocomplete
      label="Class/Subject*"
      placeholder="Start typing"
      formControlName="courseOffer"
      [options]="courseOfferingAutoCompleteOptions"
    />
    @if(courseOffer) {
      <app-course-offer-detail-card [courseOffer]="courseOffer"></app-course-offer-detail-card>
    }
    <div class="subtitle">Purpose</div>
    <ely-autocomplete label="Purpose*" formControlName="purpose" [options]="purposeOptions" />
    <div class="subtitle">Start Date of Use</div>
    <ely-datepicker label="Start date" formControlName="startDate"></ely-datepicker>
    <ely-input label="Start Time*" type="time" formControlName="startTime" />
    <div class="subtitle">End Date of Use</div>
    <ely-datepicker label="End date" formControlName="endDate"></ely-datepicker>
    <ely-input label="End Time*" type="time" formControlName="endTime" />
  </div>
  <div class="action-wrapper">
    <ely-button size="md" type="submit" width="width-filled" variant="accent">Submit Request</ely-button>
  </div>
</form>
