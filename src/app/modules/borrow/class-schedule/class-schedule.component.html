<form [formGroup]="classScheduleForm" (ngSubmit)="onSubmit()">
  <div class="class-detail-container">
    <div class="subtitle">Subject and Purpose</div>
    <app-autocomplete
      label="Class/Subject*"
      formControlName="courseOffer"
      [options]="courseOfferingAutoCompleteOptions"
    />
    <app-autocomplete label="Purpose*" formControlName="purpose" [options]="purposeOptions" />
    <app-input label="Instructor" [value]="instructor" [readonly]="true"/>
    <div class="subtitle">Start Date of Use</div>
    <app-datepicker label="Start date"></app-datepicker>
    <app-input label="Start Time*" inputType="time"/>
    <div class="subtitle">End Date of Use</div>
    <app-datepicker label="End date"></app-datepicker>
    <app-input label="End Time*" inputType="time"/>
    <!-- <app-datepicker
      label="Choose date"
      type="daterange"
      (dateRangeChanged)="onClassDateChanged($event)"
      [initialDateRange]="initialSchedule"
    />
    <app-input label="Start Period*" inputType="time" formControlName="timeOfUseStart" />
    <app-input label="End Period*" inputType="time" formControlName="timeOfUseEnd" /> -->
  </div>
  <div class="action-wrapper">
    <app-button btnType="submit" width="width-filled" type="accent">Submit Request</app-button>
  </div>
</form>
