<div class="equipment-container">
  <div class="image-wrapper">
    <img class="fit-image" [src]="image ? image : default_img" />
  </div>
  @for (content of contents; track content.id) {
    @if (content.type == 'badge') {
      <div class="badge-wrapper" [ngClass]="[content.span]">
        <span *ngFor="let content of content.content">
          <app-badge size="md">{{ content }}</app-badge>
        </span>
      </div>
    } @else {
      <div [ngClass]="[content.span]" [class.title]="content.span == 'wide'">
        {{ content.content }}
      </div>
    }
  }
  <div class="action-wrapper mid">
    @for (action of actions; track $index) {
      @if (action.action == 'icon') {
        <app-icon
          [name]="action.name"
          [size]="action.size"
          [tooltip]="action.tooltip"
          (iconclicked)="onActionClicked($event)"
        />
      } @else {
        <app-button
          size="sm"
          appearance="link"
          [icon]="action.icon"
          [action]="action.name"
          (btnclicked)="onActionClicked($event)"
        >
          {{ action.name }}
        </app-button>
      }
    }
  </div>
</div>
<mat-divider></mat-divider>
