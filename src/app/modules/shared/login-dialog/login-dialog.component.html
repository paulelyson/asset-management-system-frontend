<div class="login-container">
  <app-input [formControl]="schoolId" suffix_icon="person" placeholder="School Id" />
  <app-input [formControl]="password" suffix_icon="password" placeholder="Password" />
  <div class="action-wrapper">
    <app-button icon="login" width="width-filled" type="primary" (click)="login()">Login </app-button>
  </div>
</div>
