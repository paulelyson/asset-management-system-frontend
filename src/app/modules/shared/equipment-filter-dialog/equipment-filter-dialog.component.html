<form [formGroup]="filterForm">
  <div class="equipment-filter-container">
    <app-autocomplete [options]="departments" label="Department" formControlName="department" placeholder="Start typing..."/>
    <app-autocomplete [options]="brands" label="Brand" formControlName="brand" placeholder="Start typing..."/>
    <app-autocomplete [options]="equipmentCondition" label="Condition" formControlName="condition" placeholder="Start typing..."/>
    <app-dropdown [options]="['Yes', 'No']" label="Can Be Borrowed" (selectChanged)="onCanBeBorrowedChange($event)" placeholder="Select.."/>
    <!-- <app-autocomplete [options]="brands" label="Brand" formControlName="brand"/>
    <app-autocomplete [options]="equipmentTypes" label="Equipment Type" formControlName="equipmentType"/>
    <app-autocomplete [options]="categories" label="Categories" formControlName="categories"/>
    <app-autocomplete [options]="equipment_types" label="Location" formControlName="location"/> -->
    <div class="action-wrapper">
      <ely-button (btnclicked)="navigate()">Apply</ely-button>
      <ely-button>Cancel</ely-button>
    </div>
  </div>
</form>
