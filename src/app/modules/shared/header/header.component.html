<div [class.transparent]="isTransparent()">
  <header id="header">
    <div class="nav-wrapper">
      <span style="flex: 1"></span>
      <ul class="navigation">
        @if (isLoggedIn()) {
          @if(canAccessInventory()) {
            <li><a routerLink="/inventory">Inventory</a></li>
          }
          <li><a routerLink="/borrow">Borrow</a></li>
          <li><a routerLink="/borrowed-equipment">Borrowed Equipment</a></li>
          <div class="avatar-wrapper">
            <ely-avatar
              [label]="userName()"
              [showLabel]="true"
              [clickable]="true"
              variant="primary"
              (avatarClicked)="onAvatarClicked()"
            />
            <app-menu
              [show]="showAvatarMenu()"
              (onActionClicked)="onActionClicked($event)"
              [title]="userName()"
              [subtitles]="subtitles()"
            />
          </div>
        } @else {
          <ely-button size="lg" (btnclicked)="login()" appearance="ghost"> Login </ely-button>
          <ely-button size="lg" (btnclicked)="register()" appearance="filled" variant="accent"> Register </ely-button>
        }
      </ul>
    </div>
  </header>
</div>
