<div class="menu-container" [class.show]="show">
  <div class="title-wrapper">
    <div class="title">{{ title }}</div>
    @for (sub of subtitles; track sub) {
      <div class="subtitle">{{ sub }}</div>
    }
  </div>
  <app-button variant="link" icon="password">Change Password</app-button>
  <mat-divider></mat-divider>
  <div class="action-wrapper">
    <app-button variant="link" icon="logout" (btnclicked)="logout()">Log Out</app-button>
  </div>
</div>
