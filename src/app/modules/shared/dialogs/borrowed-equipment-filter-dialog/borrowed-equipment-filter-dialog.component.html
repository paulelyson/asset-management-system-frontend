<form [formGroup]="filterForm">
  <div class="borrowed-equipment-filter-container">
    <ely-autocomplete label="Status" [options]="status" formControlName="status"/>
    <ely-autocomplete label="Purpose" [options]="purposes" formControlName="purpose" />
    <div class="action-wrapper">
      <ely-button (btnclicked)="navigate()">Apply</ely-button>
      <ely-button>Cancel</ely-button>
    </div>
  </div>
</form>
