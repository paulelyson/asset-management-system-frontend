<form [formGroup]="borrowedEquipmentStatusForm">
  <div class="container">
    <div class="dialog-header">
      <div>
        <p class="dialog-title">{{ data.equipmentName || 'Equipment' }}</p>
        @if (data.equipmentSerialNo) {
          <p class="dialog-sub">SN: {{ data.equipmentSerialNo }}</p>
        }
      </div>
      <ely-icon size="lg" name="close" (iconclicked)="onClose()" />
    </div>
    <mat-divider></mat-divider>
    <div class="action-wrapper">
      <div class="input-row">
        <app-input label="Quantity" formControlName="quantity" />
        <app-autocomplete label="Status" [options]="statuses" formControlName="status" />
      </div>

      <div class="remarks">
        <app-textarea formControlName="remarks"></app-textarea>
      </div>
      @for (action of data.actions; track action.id) {
        <ely-button width="width-filled" (btnclicked)="onClicked(action.name)">
          {{ action.name }}
        </ely-button>
      }
    </div>
  </div>
</form>
