<div class="container">
  <div class="wrapper-title underlined">History</div>
  <!-- completed -->
  @for (content of contents; track $index) {
    <div class="step completed">
      <div class="v-stepper">
        <div class="circle"></div>
        <div class="line"></div>
      </div>

      <div class="content">
        <div class="title">{{ content.title }}</div>
        @for (subtitle of content.contents; track subtitle) {
          <div class="subtitle">{{ subtitle }}</div>
        }
      </div>
    </div>
  }
</div>
