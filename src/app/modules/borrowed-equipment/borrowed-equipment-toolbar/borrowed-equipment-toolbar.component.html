<section id="toolbar">
  <div class="toolbar-container">
    <div class="filter-badge-wrapper">
      @for (filter of filters; track filter.field) {
        <app-badge size="sm" [hasCloseIcon]="true" type="default" (closed)="onBadgeClosed(filter)">
          {{
            ['info_and_transaction', 'enable_cancel'].includes(filter.field)
              ? filter.field
              : filter.value
          }}
        </app-badge>
      }
    </div>
    <span class="spacer"></span>
    @if (filters.length) {
      <app-button variant="link" icon="history" (btnclicked)="clearFilter()">
        Clear Filters
      </app-button>
    }
    <app-toggle
      label="Show Info and Transaction"
      [isChecked]="infoAndHistory"
      (toggle)="onShowInfoAndHistoryToggle($event)"
    />
    <app-toggle
      label="Enable Cancel"
      [isChecked]="enableCancel"
      (toggle)="onEnableCancelToggle($event)"
      tooltip="Cancel allowed only before approval."
    />
    <app-button variant="link" icon="filter_list" (btnclicked)="openFilterDialog()">
      Filter
    </app-button>
    <app-input suffix_icon="search" [formControl]="searchControl" placeholder="Equipment Name" />
  </div>
</section>
