<div class="container">
  <ely-title-section>Borrowed Equipment</ely-title-section>
  <app-borrowed-equipment-toolbar [filters]="filterDisplay()"/>
  <div class="list-wrapper">
    @for (eqpmnt of borrowed_equipment(); track eqpmnt.trackId; let first = $first) {
      <ely-data-row size="md" [columns]="getRowData(eqpmnt)" [showHeader]="first" (actionClicked)="onActionClicked($event, eqpmnt)"/>
    } @empty {
      <span>No items.</span>
    }
  </div>
  <div class="action-wrapper">
    <ely-button (btnclicked)="loadMoreBorrowedEquipment()" [disabled]="!hasMore">
      Show more...
    </ely-button>
  </div>
</div>
