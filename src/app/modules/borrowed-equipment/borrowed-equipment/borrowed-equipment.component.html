<div class="container">
  <app-title-section>Borrowed Equipment</app-title-section>
  <app-borrowed-equipment-toolbar></app-borrowed-equipment-toolbar>
  <div class="list-wrapper">
    @for (eqpmnt of borrowed_equipment(); track eqpmnt.trackId; let first = $first) {
      <app-data-row [columns]="getRowData(eqpmnt)" [showHeader]="first"></app-data-row>
    } @empty {
      <span>No items.</span>
    }
  </div>
  <div class="action-wrapper">
    <app-button (btnclicked)="loadMoreBorrowedEquipment()" [disabled]="!hasMore">
      Show more...
    </app-button>
  </div>
</div>
