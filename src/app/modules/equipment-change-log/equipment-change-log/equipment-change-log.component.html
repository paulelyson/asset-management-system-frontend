<div class="container">
  <ely-title-section>Inventory</ely-title-section>
  <ely-tab [tabs]="['Inventory', 'Change Logs']" />
  <app-inventory-toolbar />
  <div class="list-wrapper">
    @for (log of changeLogs(); track log._id; let first = $first) {
      <ely-data-row
        size="md"
        [columns]="getRowData(log)"
        [showHeader]="first"
        (actionClicked)="onActionClicked($event, log)"
      />
    } @empty {
      <span>No items.</span>
    }
  </div>
</div>
