<div class="container">
  <app-title-section>Inventory</app-title-section>
  <!-- <app-tab [tabs]="['Inventory', 'Change Logs']"></app-tab> -->
  <app-inventory-toolbar [filters]="filterDisplay()" [department]="selectedDept()"/>
  <div class="list-wrapper">
    @for (eqpmnt of equipment(); track eqpmnt._id; let first = $first) {
      <app-data-row [columns]="getRowData(eqpmnt)" [showHeader]="first" (actionclicked)="onActionClicked($event, eqpmnt)"/>
    } @empty {
      <span>No items.</span>
    }
  </div>
  <div class="action-wrapper">
    <app-button (btnclicked)="loadMoreEquipment()" [disabled]="!hasMore"> Show more... </app-button>
  </div>
</div>
