<div class="container">
  <app-title-section>Inventory</app-title-section>
  <app-inventory-toolbar [filters]="filterDisplay" />
  <div class="list-wrapper">
    @for (eqpmnt of equipment(); track eqpmnt._id; let first = $first) {
      <app-data-row [columns]="getRowData(eqpmnt)" [showHeader]="first"></app-data-row>
    } @empty {
      <span>No items.</span>
    }
  </div>
  <div class="action-wrapper">
    <app-button (btnclicked)="loadMoreEquipment()" [disabled]="!hasMore"> Show more... </app-button>
  </div>
</div>
