<form [formGroup]="equipmentForm" (ngSubmit)="submit()">
  <div class="create-equipment-container">
    <div class="image-wrapper">
      <img class="fit-image" [src]="image ?? default_img" />
    </div>
    <app-file-input (filechanged)="addImage($event)"></app-file-input>
    <div class="create-equipment-wrapper">
      <app-input label="Name*" formControlName="name" />
      <app-input label="Serial Number" formControlName="serialNo" />
      <app-input label="Model Number" formControlName="modelNo" />
      <app-autocomplete label="Equipment Type" formControlName="equipmentType" />
      <app-input label="Categories" formControlName="categories" />
      <app-autocomplete label="Brand" formControlName="brand" />
      <app-input label="Color" formControlName="color" />
      <app-input label="Unit" formControlName="unit" />
      <app-autocomplete label="Matter" formControlName="matter" [options]="matter"/>
      <app-input label="Description" formControlName="description" />
      <app-input label="Remarks" formControlName="remarks" />
      <app-autocomplete label="Inventory Type" formControlName="inventorytype" />
      <app-autocomplete label="Location" formControlName="location" [options]="locationOptions" placeholder="eg. SA-B"/>
      <app-datepicker label="Date Acquired" formControlName="dateAcquired" />
    </div>
    <div formArrayName="conditionAndQuantity">
      @for (item of conditionAndQuantity.controls; track $index; let last = $last; let first = $first) {
        <div class="condition-wrapper" [formGroupName]="$index">
          <app-input label="Quantity" width="sm" formControlName="quantity"/>
          <app-autocomplete [options]="conditions" label="Condition" formControlName="condition" />
          <app-button icon="delete_outlined" appearance="link" (btnclicked)="addConditionAndQuantity()">Remove</app-button>
          @if(last) {
            <app-button icon="add" appearance="link" (btnclicked)="addConditionAndQuantity()">Add</app-button>
          }
        </div>
      }
    </div>
    <div class="action-wrapper">
      <app-button btnType="submit">Submit</app-button>
    </div>
  </div>
</form>
