<div class="container">
  <div class="dialog-header">
    <div>
      <p class="dialog-title">Download report</p>
      <p class="dialog-sub">This will generate a PDF report based on your selected filters and field configurations.</p>
    </div>
    <ely-icon size="lg" name="close" (iconclicked)="onClose()" />
  </div>
  <mat-divider></mat-divider>
  <div class="content-body">
    <div class="page-setup">
      <div class="page-setup__group">
        <p class="page-setup__label">Paper size</p>
        <ely-segmented-control
          [options]="paperSizes"
          [value]="pageSize"
          (valueChange)="onPageSizeChange($event)"
        />
      </div>
      <div class="page-setup__group">
        <p class="page-setup__label">Orientation</p>
        <ely-segmented-control
          [options]="orientations"
          [value]="orientation"
          (valueChange)="onOrientationChange($event)"
        />
      </div>
    </div>
    <div class="fields-grid">
      @for (field of equipmentFields; track field) {
        <div class="field">
          <ely-toggle
            [label]="field.label"
            [isChecked]="field.checked"
            (toggle)="onToggleField($event, field.value)"
          />
        </div>
      }
    </div>
  </div>
  <mat-divider></mat-divider>
  <div class="action-wrapper">
    <ely-button (btnclicked)="onDownloadPDF()" appearance="link" icon="download">
      Download PDF
    </ely-button>
  </div>
</div>
